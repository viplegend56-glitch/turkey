*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--night); color: var(--ivory); }
body { font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
a { color: var(--ivory); text-decoration-color: rgba(201, 165, 92, .55); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }
.ic { width: 14px; height: 14px; flex: none; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dim { color: var(--ivory-3); }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }

.top { position: sticky; top: 0; z-index: 20; background: rgba(21, 16, 12, .97); border-bottom: 1px solid var(--rule); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 12px 20px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .coin { width: 30px; height: 30px; border-radius: 50%; background: var(--coin-img) center / contain no-repeat; }
.brand b { font-family: var(--serif); font-weight: 400; font-size: 20px; }
.brand .pill { margin-left: 4px; }
.actor { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ivory-3); }
.actor input { width: 170px; }
.notice { padding: 10px 20px; font-size: 13.5px; color: var(--ivory-2); background: var(--hearth); border-top: 1px solid var(--rule); }
.notice b { color: var(--ivory); font-weight: 500; }
.draft-banner { padding: 12px 20px; background: #3a2a10; color: #f2d9a2; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 14px; }
.draft-banner[hidden] { display: none; }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.side { border-right: 1px solid var(--rule); padding: 18px 12px; }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; position: sticky; top: 130px; }
.side a { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 2px; text-decoration: none; color: var(--ivory-2); font-size: 14.5px; }
.side a:hover { background: var(--hearth); color: var(--ivory); }
.side a[aria-current="page"] { background: var(--ember); color: var(--ivory); box-shadow: inset 2px 0 0 var(--gold); }
.side .count { font-size: 12px; color: var(--ivory-3); font-variant-numeric: tabular-nums; }
.main { padding: 28px clamp(16px, 3vw, 40px) 80px; min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.view-head h1 { font-family: var(--serif); font-size: 30px; line-height: 1.15; }

.panel { border: 1px solid var(--rule); background: var(--hearth); border-radius: 3px; padding: 20px; }

.stat .k { font-size: 13px; color: var(--ivory-3); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 2px; border: 1px solid var(--rule-strong); background: none; color: var(--ivory); font: 500 13.5px/1.2 var(--sans); cursor: pointer; text-decoration: none; white-space: nowrap; }

.btn-primary { background: var(--ivory); color: var(--night); border-color: var(--ivory); }

.btn-danger { color: var(--bad); border-color: rgba(228, 122, 98, .5); }

.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn-icon { padding: 7px 9px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sans); padding: 5px 8px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.pill .ic { width: 11px; height: 11px; }
.p-ok { color: var(--ok); } .p-warn { color: var(--warn); } .p-bad { color: var(--bad); } .p-mute { color: var(--ivory-3); } .p-gold { color: var(--gold-2); }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ivory-2); min-width: 0; }

  width: 100%; background: var(--night); border: 1px solid var(--rule-strong); border-radius: 2px; padding: 9px 10px; font-size: 14px; color: var(--ivory); }
textarea { min-height: 74px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }

.check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ivory); }
.check input { margin-top: 3px; accent-color: var(--gold); width: 16px; height: 16px; flex: none; }
.check small { display: block; color: var(--ivory-3); font-size: 12.5px; }
.inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.inline > * { flex: 1 1 200px; }

.err { color: var(--bad); font-size: 13px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }

dialog { background: var(--hearth); color: var(--ivory); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }

    return { now, line, pattern };
  }
  /** The charity for turn k (k = 0 is the first turn of the campaign), or null. */
  function pickTurn(tracks, k) {

    let per = 0, before = 0;
    for (let i = 0; i < L; i++) if (P[i] === track) { per++; if (i < k % L) before++; }

  /** When turn 0 of a campaign happens: the campaign start, or rotation.startsAt (your launch time) if that is later.
      Setting startsAt at launch makes each line start from the top instead of partway through. */
  function anchorMs(cfg, campaign) {
    const s = cfg.rotation && cfg.rotation.startsAt;
    const ms = s ? zonedToUtc(s, (cfg.schedule && cfg.schedule.timezone) || 'UTC') : NaN;
    const base = isFinite(ms) ? Math.max(campaign.startMs, ms) : campaign.startMs;

  }

  function turnAt(cfg, campaign, k, opts) {
    const t = tracksFor(cfg, (opts && opts.queue) || queueFor(cfg, campaign.id), opts);
    const turn = pickTurn(t, k);

  }

    const a = anchorMs(cfg, campaign);

    return Math.floor((ms - a) / intervalMs(cfg));

    const s = Math.floor(ms / 1000);

  }
  function fmtTime(ms, tz) {
    return new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(ms);

  /** inclusive date range for a campaign, e.g. "Nov 23 – 26" or "Nov 27 – Dec 25" */

    const b = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'short', day: 'numeric' }).formatToParts(c.endMs - 1);

  /* ---------- explorer links ---------- */
  function explorer(cfg) { return ((cfg.chain && cfg.chain.explorer) || 'https://solscan.io').replace(/\/$/, ''); }
  function txUrl(cfg, sig) { return explorer(cfg) + '/tx/' + encodeURIComponent(sig); }
  function accountUrl(cfg, a) { return explorer(cfg) + '/account/' + encodeURIComponent(a); }
  function tokenUrl(cfg, a) { return explorer(cfg) + '/token/' + encodeURIComponent(a); }

  return {
    b58decode, isSolAddress, isConfigId, zonedToUtc, isValidTz, tzOffsetMs,
    campaigns, campaignAt, campaignById, campaignForTime,
    charity, hasRoute, signedUp, payoutReady, lineReady, effectiveStatus, queueFor, placeOf,
    rotationMode, tracksFor, pickTurn, intervalMs, anchorMs, turnAt, turnIndexAt, rotation, roundStatus,
    fmtNum, fmtSol, fmtUsdc, fmtAmt, fmtUsd, shortAddr, splitDuration, pad2, fmtClock,

})();

<script>
/* HOPE config checks shared by the admin editor (in the browser) and the admin panel server.
   HopeCore is passed in as C so this file works in both places. */
const HopeValidate = (() => {
  'use strict';
  const STALE_DAYS = 7;

  function shapeOk(j) {
    return !!(j && typeof j === 'object' && !Array.isArray(j) && j.schedule && Array.isArray(j.schedule.campaigns) &&
      Array.isArray(j.charities) && j.queues && typeof j.queues === 'object' && j.rotation && j.project);
  }
  function daysSince(date, now) { const t = Date.parse(date); return isFinite(t) ? Math.floor((now - t) / 86400000) : Infinity; }

  /** Returns [{ l: 'e' | 'w', t: text }]. Errors (e) block publishing; warnings (w) do not. */
  function validate(C, cfg, now) {
    now = now == null ? Date.now() : now;
    const out = [];
    const err = t => out.push({ l: 'e', t }), warn = t => out.push({ l: 'w', t });
    const zone = cfg.schedule.timezone;
    if (!C.isValidTz(zone)) { err('The time zone "' + zone + '" is not recognized.'); return out; }
    const camps = cfg.schedule.campaigns || [];
    const ids = new Set();
    for (const c of camps) {
      if (ids.has(c.id)) err('Two campaigns share the ID "' + c.id + '".'); ids.add(c.id);
      const s = C.zonedToUtc(c.start, zone), e = C.zonedToUtc(c.end, zone);
      if (!isFinite(s) || !isFinite(e)) err(c.name + ': the start or end is not a valid date and time.');
      else if (e <= s) err(c.name + ': the end must come after the start.');
      if (!cfg.queues[c.id]) warn(c.name + ' has no line yet.');
    }
    const sorted = C.campaigns(cfg);
    for (let i = 1; i < sorted.length; i++) if (sorted[i].startMs < sorted[i - 1].endMs) err(sorted[i - 1].name + ' and ' + sorted[i].name + ' overlap. Only one campaign can run at a time.');
    const cids = new Set(cfg.charities.map(c => c.id));
    if (cids.size !== cfg.charities.length) err('Two charities share an ID.');
    for (const q of Object.keys(cfg.queues)) {
      if (!Array.isArray(cfg.queues[q])) { err('The line "' + q + '" is not a list.'); continue; }
      for (const id of cfg.queues[q]) if (!cids.has(id)) err('The ' + q + ' line lists "' + id + '", which is not in the charity list.');
      if (!camps.some(c => c.id === q)) warn('The line "' + q + '" has no matching campaign.');
    }
    const seen = {};
    for (const ch of cfg.charities) {
      const cid = ch.donate && ch.donate.configId;
      if (cid) {
        if (!C.isConfigId(cid)) err(ch.name + ': the donate.gg config ID is not valid.');
        else if (seen[cid]) err(ch.name + ' and ' + seen[cid] + ' share a donate.gg config ID. Each charity needs its own.');
        else seen[cid] = ch.name;
      }
      if (ch.status === 'approved' && !C.isConfigId(cid)) err(ch.name + ' is approved but has no valid donation ID, so the site treats it as pending.');
      if (ch.status === 'approved' && !Object.keys(cfg.queues).some(q => Array.isArray(cfg.queues[q]) && cfg.queues[q].includes(ch.id))) warn(ch.name + ' is approved but is not in any line.');
    }
    const approved = cfg.charities.filter(c => c.status === 'approved' && c.donate && c.donate.configId);
    const oldest = approved.reduce((m, c) => Math.max(m, daysSince(c.donate.checkedAt, now)), 0);
    if (approved.length && oldest > STALE_DAYS) warn('Some charities\' donate.gg sign-up status was last checked ' + (oldest === Infinity ? 'never' : oldest + ' days ago') + '. Run "node scripts/refresh-lines.mjs" to check them all.');
    const mode = C.rotationMode(cfg);
    for (const c of sorted) {
      if (c.endMs < now) continue;
      const t = C.tracksFor(cfg, C.queueFor(cfg, c.id));
      if (!t.now.length && !t.line.length) warn('The ' + c.name + ' line has no approved charity with a donation ID yet. The site will show "Waiting for an approved charity".');
      else if (!t.now.length && mode === 'alternate') warn('No charity in the ' + c.name + ' line is signed up with donate.gg, so every turn goes to the long line and donate.gg holds every gift.');
      else if (!t.now.length) warn('Signed-up-only mode is on and no charity in the ' + c.name + ' line is signed up, so the rotation waits.');
    }
    const p = cfg.project || {};
    if (p.donationWallet && !C.isSolAddress(p.donationWallet)) err('The donation wallet is not a valid Solana address.');
    if (p.creatorWallet && !C.isSolAddress(p.creatorWallet)) err('The creator wallet is not a valid Solana address.');
    if (p.contractAddress && !C.isSolAddress(p.contractAddress)) err('The contract address is not a valid Solana address.');
    else if (!p.contractAddress) warn('The contract address is not set. The site shows "Posted here and on X at launch".');
    for (const k of Object.keys(p.links || {})) if (p.links[k] && !/^https:\/\/\S+$/i.test(p.links[k])) err('The ' + k + ' link must start with https://.');
    if (cfg.receipts != null && !Array.isArray(cfg.receipts)) err('The receipts list is not a list.');
    const rids = new Set();
    for (const r of Array.isArray(cfg.receipts) ? cfg.receipts : []) {
      const ch = r && C.charity(cfg, r.charityId);
      const who = ch ? ch.name : 'A receipt';
      if (!r || typeof r !== 'object') { err('A receipt is not valid.'); continue; }
      if (!r.id || rids.has(r.id)) err(who + ': a receipt has a missing or repeated ID.'); rids.add(r.id);
      if (!ch) err('A receipt points to "' + r.charityId + '", which is not in the charity list.');
      if (typeof r.url !== 'string' || !/^https:\/\/[^\s"'<>]+$/i.test(r.url)) err(who + ': the receipt link must start with https://.');
      if (!(Number(r.amount) > 0)) err(who + ': the receipt amount must be more than zero.');
      if (['SOL', 'USD', 'USDC'].indexOf(r.unit) < 0) err(who + ': the receipt must be in SOL, USD or USDC.');
      if (typeof r.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !isFinite(Date.parse(r.date))) err(who + ': the receipt date is not valid.');

    }
    if ((Number(cfg.rotation.intervalSeconds) || 0) < 60) err('The rotation interval must be at least 60 seconds.');
    if (cfg.rotation.paused) warn('The rotation is paused. No handoffs are made until it is resumed.');
    if (cfg.display && cfg.display.demo === true) warn('The site is showing demo data to everyone. Turn it off under Token, links & data once the coin launches.');

  }

  /** Everything that decides where or when a gift is sent, as one string.
      If this string differs between two configs, donation routing changed. */
  function routingKey(C, cfg) {
    const p = cfg.project || {}, r = cfg.rotation || {}, s = cfg.schedule || {};

    const lines = {};
    for (const c of camps) {
      const q = (cfg.queues && Array.isArray(cfg.queues[c[0]])) ? cfg.queues[c[0]] : [];
      lines[c[0]] = q.map(id => C.charity(cfg, id)).filter(ch => C.hasRoute(ch)).map(ch => [ch.id, String(ch.donate.configId).trim(), C.signedUp(ch) ? 1 : 0]);
    }
    return JSON.stringify({
      wallet: p.donationWallet || null,
      relay: (cfg.chain && cfg.chain.relayProgram) || null,
      tz: s.timezone || null,
      camps,
      rot: [Number(r.intervalSeconds) || 0, r.startsAt || null, Number(r.minHandoffSol) || 0, !!r.paused, C.rotationMode(cfg), Object.keys(r.shifts || {}).sort().map(k => [k, Number(r.shifts[k]) || 0])],
      lines

  }

  function canon(v) {
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);
  }
  const str = (v, max) => typeof v === 'string' && v.length <= max;

  /** The audit log only grows. Returns { ok, added } or { ok: false, error }. */
  function auditDelta(live, next, now) {
    const a = (live && Array.isArray(live.auditLog)) ? live.auditLog : [];
    const b = next && next.auditLog;
    if (!Array.isArray(b)) return { ok: false, error: 'The audit log is missing.' };
    if (b.length < a.length) return { ok: false, error: 'The audit log is shorter than the published one. Earlier entries can\'t be removed.' };
    for (let i = 0; i < a.length; i++) if (canon(a[i]) !== canon(b[i])) return { ok: false, error: 'An earlier audit log entry was changed. Entries can only be added.' };
    const added = b.slice(a.length);
    for (const e of added) {
      if (!e || typeof e !== 'object' || Array.isArray(e)) return { ok: false, error: 'A new audit entry is not valid.' };
      const t = Date.parse(e.at);
      if (!str(e.at, 40) || !isFinite(t)) return { ok: false, error: 'A new audit entry has no valid time.' };
      if (now != null && t > now + 10 * 60000) return { ok: false, error: 'A new audit entry is dated in the future. Check this device\'s clock.' };
      if (!str(e.actor, 80) || !e.actor.trim()) return { ok: false, error: 'A new audit entry has no name. Add your name in the top bar.' };
      if (!str(e.action, 80) || !e.action.trim()) return { ok: false, error: 'A new audit entry has no action.' };
      if (!str(e.details, 60000)) return { ok: false, error: 'A new audit entry has no details.' };
      if (typeof e.routing !== 'boolean') return { ok: false, error: 'A new audit entry does not say whether it changes routing.' };
      if (e.reason != null && !str(e.reason, 2000)) return { ok: false, error: 'A new audit entry has a reason that is too long.' };
    }
    return { ok: true, added };
  }

  /** What a publish must satisfy, given the published config and the new one.
      Returns { ok, added, routingChanged, contractChanged } or { ok: false, code, error }. */
  function publishCheck(C, live, next, now) {
    if (!shapeOk(next)) return { ok: false, code: 'shape', error: 'That does not look like a Turkeycoin config.' };
    const d = auditDelta(live, next, now);
    if (!d.ok) return { ok: false, code: 'audit', error: d.error };
    const strip = c => { const o = Object.assign({}, c); delete o.auditLog; return canon(o); };
    if (!d.added.length) {
      return strip(live) === strip(next)
        ? { ok: false, code: 'nothing', error: 'Nothing has changed, so there is nothing to publish.' }
        : { ok: false, code: 'audit', error: 'The settings changed but the audit log has no new entry. Make the change in this editor so it is recorded.' };
    }
    const errors = validate(C, next, now).filter(i => i.l === 'e');
    if (errors.length) return { ok: false, code: 'invalid', error: 'Fix these first: ' + errors.slice(0, 5).map(i => i.t).join(' ') + (errors.length > 5 ? ' And ' + (errors.length - 5) + ' more.' : ''), problems: errors.map(i => i.t) };

      return { ok: false, code: 'routing-unlogged', error: 'This changes where or when donations are sent, but the audit log has no routing entry for it. Make the change in this editor so it is logged.' };
    }
    const contractChanged = ((live.project || {}).contractAddress || null) !== ((next.project || {}).contractAddress || null);

/* Turkeycoin admin: three pages. Charities (give and post proof), Rotation (start over, pause) and Links

(() => {

  function nowLocal(ms) {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz(), year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(ms);
    const g = t => (parts.find(x => x.type === t) || {}).value;
    return g('year') + '-' + g('month') + '-' + g('day') + 'T' + g('hour') + ':' + g('minute');

  function fmtGift(r) { const a = Number(r.amount); return r.unit === 'USD' ? '$' + C.fmtNum(a, 2) : new Intl.NumberFormat('en-US', { maximumFractionDigits: a >= 100 ? 1 : 4 }).format(a) + ' ' + r.unit; }

  function donatePage(ch) {
    const d = ch.donate || {};
    if (d.pageUrl) return d.pageUrl;
    return C.signedUp(ch) ? 'https://donate.gg/charities/' + slugName(ch.name) : (ch.website || null);
  }
  function siteUrl() { const w = A.draft.project.links && A.draft.project.links.website; return w && /^https:\/\//.test(w) ? w.replace(/\/+$/, '') : ''; }
  function charityUrl(id) { const s = siteUrl(); return s ? s + '/?charity=' + encodeURIComponent(id) : ''; }
  function copyText(t) {
    const done = () => toast('Link copied: ' + t);
    try { navigator.clipboard.writeText(t).then(done, () => window.prompt('Copy this link:', t)); } catch (e) { window.prompt('Copy this link:', t); }
  }
  function proofsFor(id) { return (A.draft.receipts || []).filter(r => r.charityId === id); }

    if (!list.length) return '';
    const by = {};
    list.forEach(r => { by[r.unit] = (by[r.unit] || 0) + Number(r.amount); });

  }

  /* ------------------------------------------------------------------ save = publish */
  function setState(kind, text) {
    const p = $('#saveState');
    p.className = 'pill ' + ({ ok: 'p-ok', busy: 'p-mute', bad: 'p-bad', mute: 'p-mute' }[kind] || 'p-mute');
    p.innerHTML = (kind === 'bad' ? ICON('warn') : kind === 'ok' ? ICON('check') : '') + E(text) + (kind === 'bad' ? ' <button class="linkbtn" type="button" data-act="retry">Try again</button>' : '');
  }

    }

  function viewCamp() {
    const list = C.campaigns(A.draft);
    if (A.q.camp && list.some(c => c.id === A.q.camp)) return list.find(c => c.id === A.q.camp);
    const at = C.campaignAt(A.draft, Date.now());
    return at.current || at.next || at.prev || null;
  }
  /** Every charity's first upcoming turn in this campaign, plus its place in the rotation. */
  function turns(camp, now) {
    const cfg = A.draft, m = new Map();
    const a0 = C.anchorMs(cfg, camp);
    const k0 = now < a0 ? 0 : C.turnIndexAt(cfg, camp, now);
    const t = C.tracksFor(cfg, C.queueFor(cfg, camp.id));
    const order = new Map((t.seq || t.now.concat(t.line)).map((c, i) => [c.id, i]));
    if (k0 >= 0) {
      const iv = C.intervalMs(cfg), span = t.seq ? t.seq.length : t.pattern.length * Math.max(t.now.length, t.line.length, 1);
      for (let k = k0; k < k0 + span; k++) {
        const ms = a0 + k * iv;
        if (ms >= camp.endMs) break;
        const turn = C.pickTurn(t, k);
        if (!turn) break;
        if (!m.has(turn.charity.id)) m.set(turn.charity.id, { k, ms, current: now >= a0 && k === k0 });
      }
    }
    return { m, order, k0, a0, started: now >= a0 };
  }
  function rowsFor(camp, now) {
    const cfg = A.draft, T = turns(camp, now), text = A.q.text.trim().toLowerCase();
    const rows = C.queueFor(cfg, camp.id).map(ch => ({ ch, st: C.effectiveStatus(ch), nt: T.m.get(ch.id) || null }))
      .sort((a, b) => (T.order.has(a.ch.id) ? T.order.get(a.ch.id) : 1e9) - (T.order.has(b.ch.id) ? T.order.get(b.ch.id) : 1e9) ||
        (b.st === 'ready' ? 1 : 0) - (a.st === 'ready' ? 1 : 0) || a.ch.name.localeCompare(b.ch.name));   // fixed line order
    return { T, all: rows, rows: text ? rows.filter(r => [r.ch.name, C.placeOf(r.ch), r.ch.donate && r.ch.donate.taxId].join(' ').toLowerCase().includes(text)) : rows };
  }
  function turnProofs(ch, startMs) {
    const day = new Intl.DateTimeFormat('en-CA', { timeZone: tz(), year: 'numeric', month: '2-digit', day: '2-digit' }).format(startMs);
    return proofsFor(ch.id).filter(r => (r.addedAt ? Date.parse(r.addedAt) >= startMs - 600000 : r.date >= day));
  }

  /* ------------------------------------------------------------------ pages */
  function render() {
    if (!A.draft) return;
    $$('#sideNav a').forEach(a => { if (a.getAttribute('href') === '#' + A.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $('#view').innerHTML = { charities: viewCharities, rotation: viewRotation, links: viewLinks }[A.view]();
    tick();
  }
  function head(title, text, extra) { return '<div class="view-head"><div><h1>' + E(title) + '</h1>' + (text ? '<p>' + text + '</p>' : '') + '</div>' + (extra || '') + '</div>'; }

  function viewCharities() {
    const camps = C.campaigns(A.draft), camp = viewCamp();
    if (!camp) return head('Charities', 'No campaigns are scheduled.');
    const tabs = camps.length > 1 ? '<div class="tabs" role="tablist">' + camps.map(c => '<button type="button" role="tab" class="tab" data-act="camp" data-id="' + E(c.id) + '" aria-selected="' + (c.id === camp.id) + '">' + E(c.name) + '</button>').join('') + '</div>' : '';
    return head('Charities', 'The ' + E(camp.name) + ' line, in the same order as the site. Click Donate to give, then Proof to paste the receipt link. You can add more than one.', tabs) +
      '<div class="inline ctools"><label class="f" for="cqText">Search<input type="search" id="cqText" value="' + E(A.q.text) + '" placeholder="Name, city or EIN"></label><span class="dim" id="chCount"></span></div>' +
      '<div class="table-wrap"><table class="ch-table"><thead><tr><th>Charity</th><th>Paid</th><th>Next turn</th><th>Given</th><th><span class="vh">Donate and proof</span></th></tr></thead><tbody id="chRows">' + charityRows(camp) + '</tbody></table></div>';
  }
  function charityRows(camp) {
    const now = Date.now(), R = rowsFor(camp, now), paused = !!A.draft.rotation.paused;
    A.turnKey = camp.id + '|' + R.T.k0 + '|' + R.T.started + '|' + paused;
    const cnt = $('#chCount');
    const countTxt = R.rows.length === R.all.length ? R.all.length + ' charities' : R.rows.length + ' of ' + R.all.length;
    if (cnt) cnt.textContent = countTxt; else setTimeout(() => { const c = $('#chCount'); if (c) c.textContent = countTxt; });
    if (!R.rows.length) return '<tr><td colspan="5" class="dim">No charities match.</td></tr>';
    return R.rows.map(r => {
      const ch = r.ch, list = proofsFor(ch.id), page = donatePage(ch);
      const isCur = !!(r.nt && r.nt.current && !paused);
      const got = isCur ? turnProofs(ch, r.nt.ms).length > 0 : false;
      let next;
      if (r.st === 'pending' || r.st === 'inactive') next = '<span class="dim">Not in the rotation</span>';
      else if (paused) next = '<span class="dim">Paused</span>';
      else if (isCur) next = got ? '<b class="ok">' + ICON('check') + 'Received</b>' : '<b class="now">Receiving now</b>';
      else if (r.nt) next = '<span data-cd="' + r.nt.ms + '"></span>';
      else next = '<span class="dim">No turn left this season</span>';
      const kind = r.st === 'ready' ? 'By crypto' : 'By card';
      return '<tr' + (isCur ? ' class="is-current"' : '') + '><td>' + (charityUrl(ch.id) ? '<a class="name" href="' + E(charityUrl(ch.id)) + '" target="_blank" rel="noopener">' + E(ch.name) + '</a>' : '<span class="name">' + E(ch.name) + '</span>') + '<br><span class="dim">' + E(C.placeOf(ch) || '') + '</span></td>' +
        '<td><span class="kind">' + kind + '</span></td><td>' + next + '</td>' +
        '<td>' + (list.length ? E(total(list)) + '<br><span class="dim">' + list.length + (list.length === 1 ? ' receipt' : ' receipts') + '</span>' : '<span class="dim">Nothing yet</span>') + '</td>' +
        '<td class="give">' + (page ? '<a class="btn" href="' + E(page) + '" target="_blank" rel="noopener">Donate ' + ICON('ext') + '</a>' : '<span class="dim">No link</span>') +
        '<button class="btn' + (isCur && !got ? ' btn-primary' : '') + '" type="button" data-act="proof" data-id="' + E(ch.id) + '">Proof' + (list.length ? ' <span class="count">' + list.length + '</span>' : '') + '</button>' +
        '<button class="btn" type="button" data-act="copy-link" data-id="' + E(ch.id) + '" title="' + E(charityUrl(ch.id)) + '">Copy link</button></td></tr>';
    }).join('');
  }
  function refreshRows() { const camp = viewCamp(), b = $('#chRows'); if (camp && b) { b.innerHTML = charityRows(camp); tick(); } }

  function viewRotation() {
    const cfg = A.draft, camp = viewCamp(), r = cfg.rotation, now = Date.now();
    let status = 'No campaign is scheduled.';
    if (camp) {
      const T = turns(camp, now), t = C.tracksFor(cfg, C.queueFor(cfg, camp.id));
      const cur = T.started && T.k0 >= 0 ? C.pickTurn(t, T.k0) : null;
      const first = C.pickTurn(t, 0);
      if (r.paused) status = '<b>Paused.</b> The site shows the rotation as paused.';
      else if (!T.started) status = '<b>Counting down.</b> ' + E(first ? first.charity.name : 'The first charity') + ' starts receiving <span data-cd="' + T.a0 + '"></span>.';
      else if (cur) status = '<b>Running.</b> ' + E(cur.charity.name) + ' is receiving now. Next turn <span data-cd="' + (T.a0 + (T.k0 + 1) * C.intervalMs(cfg)) + '"></span>.';
      else status = '<b>' + E(camp.name) + ' is over.</b>';
    }
    return head('Rotation', E(camp ? camp.name : 'Rotation') + ', one charity every ' + Math.round(C.intervalMs(cfg) / 60000) + ' minutes.') +
      '<div class="panel"><p class="rot-status">' + status + '</p></div>' +
      '<div class="grid g3">' +
      '<div class="panel"><h2>Skip to next</h2><p class="dim">Ends this turn early. The next charity starts receiving right away, and every turn after it moves up too.</p><div class="row-actions" style="margin-top:14px"><button class="btn btn-primary" type="button" data-act="skip"' + (r.paused ? ' disabled' : '') + '>Skip to next</button></div></div>' +
      '<div class="panel"><h2>Start over</h2><p class="dim">Goes back to the first charity in the line, and it starts receiving right away.</p><div class="row-actions" style="margin-top:14px"><button class="btn" type="button" data-act="restart">Start over</button></div></div>' +
      '<div class="panel"><h2>' + (r.paused ? 'Paused' : 'Pause') + '</h2><p class="dim">' + (r.paused ? 'Turns are on hold. Resume to carry on where the line is.' : 'Puts the turns on hold. The site says the rotation is paused.') + '</p><div class="row-actions" style="margin-top:14px">' +
        (r.paused ? '<button class="btn btn-primary" type="button" data-act="resume">Resume</button>' : '<button class="btn" type="button" data-act="pause">' + ICON('pause') + 'Pause</button>') + '</div></div>' +
      '</div>';
  }

  function viewLinks() {
    const p = A.draft.project, l = p.links || {};
    const tf = (id, label, val, hint, cls) => '<label class="f" for="' + id + '">' + label + '<input type="text" id="' + id + '" class="' + (cls || '') + '" value="' + E(val || '') + '" spellcheck="false" autocomplete="off">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
    return head('Links', '') +
      '<form id="linksForm" class="panel" novalidate><div class="grid">' +
      tf('lkX', 'X', l.x, 'Full link, like https://x.com/givinghopesol') +
      tf('lkCa', 'Contract address (CA)', p.contractAddress, 'Visitors copy it from the CA button. Leave it empty until launch.', 'mono') +
      tf('lkSite', 'Website', l.website, 'The site\'s address, like https://turkeycoin.fun. Used for the charity links.') +
      tf('lkWallet', 'Donation wallet', p.creatorWallet || p.donationWallet, 'The wallet the creator fees go to. "In the vault" on the site shows its SOL balance.', 'mono') +
      '</div><div class="row-actions" style="margin-top:16px"><button class="btn btn-primary" type="submit">Save</button></div></form>';
  }

  /* ------------------------------------------------------------------ actions */
  function restartRotation() {
    const at = nowLocal(Math.floor(Date.now() / 60000) * 60000), from = A.draft.rotation.startsAt || null;   // the first charity starts receiving now
    if (commit({ action: 'rotation.restarted', routing: true, details: 'Started the rotation over from the first charity at ' + at + ' (' + tz() + ')' + (from ? ', was ' + from : ''), apply: c => { c.rotation.startsAt = at; c.rotation.paused = false; delete c.rotation.shifts; } })) toast('Started over. The first charity is receiving now.');
  }
  /** End the current turn now: this campaign's turns move earlier by the time that was left, so the next charity starts right away. */
  function skipTurn() {
    const camp = viewCamp(), now = Date.now();
    if (!camp || now >= camp.endMs) { toast('No campaign is running.'); return; }
    const T = turns(camp, now), t = C.tracksFor(A.draft, C.queueFor(A.draft, camp.id));
    const nextStart = T.started ? T.a0 + (T.k0 + 1) * C.intervalMs(A.draft) : T.a0;
    const nk = T.started ? T.k0 + 1 : 0, nx = C.pickTurn(t, nk), cur = T.started ? C.pickTurn(t, T.k0) : null;
    if (!nx || nextStart >= camp.endMs) { toast('There is no next turn this season.'); return; }
    const add = Math.max(1, Math.ceil((nextStart - now) / 1000));
    if (commit({
      action: 'rotation.skipped', routing: true,
      details: 'Skipped ahead: ' + (cur ? cur.charity.name + '\'s turn ended early' : 'started the first turn early') + ', ' + nx.charity.name + ' is up now (' + camp.name + ' moved ' + Math.round(add / 60) + ' min earlier)',
      apply: c => { c.rotation.shifts = Object.assign({}, c.rotation.shifts); c.rotation.shifts[camp.id] = (Number(c.rotation.shifts[camp.id]) || 0) + add; }
    })) toast(nx.charity.name + ' is up now. The site shows it in a minute or two.');
  }
  function setPaused(paused) {
    if (commit({ action: paused ? 'rotation.paused' : 'rotation.resumed', routing: true, details: paused ? 'Paused the rotation' : 'Resumed the rotation', apply: c => { c.rotation.paused = paused; } })) toast(paused ? 'Paused.' : 'Resumed.');
  }
  function saveLinks(e) {
    e.preventDefault();
    const p = A.draft.project, val = id => $('#' + id).value.trim();
    const x = val('lkX') || null, ca = val('lkCa') || null, wallet = val('lkWallet') || null, site = (val('lkSite') || '').replace(/\/+$/, '') || null;
    if (site && !/^https:\/\/\S+$/i.test(site)) { toast('The website must start with https://.'); $('#lkSite').focus(); return; }
    if (x && !/^https:\/\/\S+$/i.test(x)) { toast('The X link must start with https://.'); $('#lkX').focus(); return; }
    if (ca && !C.isSolAddress(ca)) { toast('That contract address is not a valid Solana address.'); $('#lkCa').focus(); return; }
    if (wallet && !C.isSolAddress(wallet)) { toast('That wallet is not a valid Solana address.'); $('#lkWallet').focus(); return; }
    const l = p.links || {}, changes = [];
    if ((l.x || null) !== x) changes.push('X: ' + (x || 'none'));
    if ((l.website || null) !== site) changes.push('Website: ' + (site || 'none'));
    if ((p.contractAddress || null) !== ca) changes.push('Contract address: ' + (ca || 'none'));
    if ((p.creatorWallet || p.donationWallet || null) !== wallet) changes.push('Donation wallet: ' + (wallet || 'none'));
    if (!changes.length) { toast('Nothing changed.'); return; }
    const caChanged = (p.contractAddress || null) !== ca;
    commit({
      action: 'project.updated', routing: caChanged || changes.some(c => /wallet/.test(c)), details: changes.join('; '),
      apply: c => { c.project.contractAddress = ca; c.project.donationWallet = wallet; delete c.project.creatorWallet; c.project.links = Object.assign({}, c.project.links, { x, website: site }); }
    });
  }

  function openProof(id) {
    const ch = C.charity(A.draft, id);
    if (!ch) return;
    A.proofId = id;
    const page = donatePage(ch), list = proofsFor(id);
    $('#pfTitle').textContent = ch.name;
    $('#pfBody').innerHTML =
      (page ? '<p class="dim">' + (C.signedUp(ch) ? 'Give on ' : 'Give by card on ') + '<a href="' + E(page) + '" target="_blank" rel="noopener">' + E(hostOf(page)) + ' ' + ICON('ext') + '</a>, then paste the receipt link here.</p>' : '<p class="dim">No donate link on file for this charity.</p>') +
      (list.length ? '<ul class="proof-list">' + list.map(r => '<li><span>' + E(fmtGift(r)) + '</span><a href="' + E(r.url) + '" target="_blank" rel="noopener">' + E(hostOf(r.url)) + ' ' + ICON('ext') + '</a><span class="dim">' + E(r.date) + '</span><button class="btn btn-danger" type="button" data-act="proof-del" data-id="' + E(r.id) + '">Remove</button></li>').join('') + '</ul>' : '') +
      '<h3>' + (list.length ? 'Add another receipt' : 'Add a receipt') + '</h3>' +
      '<label class="f" for="pfUrl">Link<input type="url" id="pfUrl" placeholder="https://" spellcheck="false" autocomplete="off"></label>' +
      '<div class="grid g2"><label class="f" for="pfAmt">Amount<input type="number" id="pfAmt" min="0" step="any" inputmode="decimal"></label>' +
      '<label class="f" for="pfUnit">Paid in<select id="pfUnit"><option value="USD">US dollars</option><option value="SOL">SOL</option><option value="USDC">USDC</option></select></label></div>';
    $('#pfUnit').value = A.lastUnit || (C.signedUp(ch) ? 'SOL' : 'USD');
    $('#pfErr').textContent = '';
    if (!$('#dlgProof').open) $('#dlgProof').showModal();
    $('#pfUrl').focus();
  }
  function saveProof(e) {
    e.preventDefault();
    const ch = C.charity(A.draft, A.proofId);
    if (!ch) return;
    const url = $('#pfUrl').value.trim(), amount = Number($('#pfAmt').value), unit = $('#pfUnit').value;
    const fail = t => { $('#pfErr').textContent = t; };
    if (!/^https:\/\/[^\s"'<>]+$/i.test(url)) return fail('Paste the link. It starts with https://.');
    if (!(amount > 0)) return fail('Add the amount.');
    if ((A.draft.receipts || []).some(r => r.url === url)) return fail('That link is already saved.');
    const rc = { id: 'r-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), charityId: ch.id, date: today(), amount, unit, url, note: null, addedAt: new Date().toISOString() };
    A.lastUnit = unit;
    if (commit({ action: 'receipt.added', routing: false, details: 'Receipt: ' + ch.name + ', ' + fmtGift(rc) + ', ' + url, apply: c => { c.receipts = (c.receipts || []).concat(rc); } })) {
      toast('Receipt saved for ' + ch.name + '. Click Proof again to add another.');
      $('#dlgProof').close();
    }
  }
  function removeProof(rid) {
    const r = (A.draft.receipts || []).find(x => x.id === rid);
    if (!r) return;
    const ch = C.charity(A.draft, r.charityId);
    if (commit({ action: 'receipt.removed', routing: false, details: 'Removed receipt: ' + (ch ? ch.name : r.charityId) + ', ' + fmtGift(r) + ', ' + r.url, apply: c => { c.receipts = (c.receipts || []).filter(x => x.id !== rid); } })) openProof(r.charityId);
  }
  function confirm(title, text, go, fn) {
    $('#rmTitle').textContent = title; $('#rmText').textContent = text; $('#rmGo').textContent = go;
    A.confirmFn = fn;
    $('#dlgRemove').showModal();
  }

  /* ------------------------------------------------------------------ countdowns */
  function tick() {
    const now = Date.now();
    $$('[data-cd]').forEach(el => { const v = 'in ' + fmtLeft(Number(el.dataset.cd) - now); if (el.textContent !== v) el.textContent = v; });
    if (A.view === 'charities') {
      const camp = viewCamp();
      if (camp) { const T = turns(camp, now); if (A.turnKey && A.turnKey !== camp.id + '|' + T.k0 + '|' + T.started + '|' + !!A.draft.rotation.paused) refreshRows(); }
    } else if (A.view === 'rotation' && $$('[data-cd]').some(el => Number(el.dataset.cd) <= now)) render();
  }

  /* ------------------------------------------------------------------ the admin panel server */
  function call(path, opts) {
    opts = opts || {};
    const headers = { 'X-Requested-With': 'hope-admin' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store', credentials: 'same-origin' });
  }
  async function detectPanel() {
    if (!/^https?:$/.test(location.protocol) || window.claude) return null;
    try {
      const r = await call('api/panel');
      if (!r.ok) return null;
      const j = await r.json();
      return j && j.panel === true && j.repo ? j : null;
    } catch (e) { return null; }
  }
  async function loadLive() {
    let r = null, j = null;
    try { r = await call('api/config'); j = await r.json().catch(() => null); } catch (e) { r = null; }
    if (r && r.status === 401) { signedOut(); return false; }
    if (!r || !r.ok || !j || !V.shapeOk(j.config)) {
      $('#view').innerHTML = '<div class="panel"><h2>The live settings could not be loaded</h2><p class="err">' + E((j && j.error) || 'Could not reach the panel. Check your connection.') + '</p><div class="row-actions" style="margin-top:14px"><button class="btn btn-primary" type="button" data-act="reload">Try again</button></div></div>';
      return false;
    }
    A.base = j.config; A.sha = j.sha;
    return true;
  }
  function signedOut() { toast('You were signed out. Sign in again.'); setTimeout(() => { location.href = './'; }, 1800); }
  async function signOut() {
    try { await call('logout', { method: 'POST' }); } catch (e) { /* the sign-in page shows either way */ }
    location.href = './';
  }

  /* ------------------------------------------------------------------ wiring */
  function bind() {
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); A.view = VIEWS.includes(h) ? h : 'charities'; render(); window.scrollTo(0, 0); });
    window.addEventListener('beforeunload', e => { if (A.busy || A.failed) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('click', e => {
      const closeBtn = e.target.closest('[data-close]');
      if (closeBtn) { const d = closeBtn.closest('dialog'); if (d) d.close(); return; }
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
      switch (act) {
        case 'camp': A.q.camp = id; render(); break;
        case 'proof': openProof(id); break;
        case 'copy-link': { const u = charityUrl(id); if (u) copyText(u); else { toast('Add the site\'s web address under Links first.'); } break; }
        case 'proof-del': removeProof(id); break;
        case 'restart': confirm('Start over?', 'The line goes back to its first charity, and it starts receiving right away.', 'Start over', restartRotation); break;
        case 'skip': { const camp = viewCamp(), now = Date.now(); if (!camp) break; const T = turns(camp, now), t = C.tracksFor(A.draft, C.queueFor(A.draft, camp.id)); const cur = T.started ? C.pickTurn(t, T.k0) : null, nx = C.pickTurn(t, T.started ? T.k0 + 1 : 0);
          confirm('Skip to the next charity?', (cur ? cur.charity.name + '\'s turn ends now. ' : '') + (nx ? nx.charity.name + ' starts receiving right away.' : ''), 'Skip', skipTurn); break; }
        case 'pause': setPaused(true); break;
        case 'resume': setPaused(false); break;
        case 'retry': publish(); break;
        case 'reload': location.reload(); break;
        case 'sign-out': signOut(); break;
      }
    });
    document.addEventListener('submit', e => {
      if (e.target.id === 'linksForm') saveLinks(e);
      else if (e.target.id === 'pfForm') saveProof(e);
    });
    document.addEventListener('input', e => { if (e.target.id === 'cqText') { A.q.text = e.target.value; refreshRows(); } });
    $('#rmGo').addEventListener('click', () => { const fn = A.confirmFn; A.confirmFn = null; $('#dlgRemove').close(); if (fn) fn(); });
    $('#dlgProof').addEventListener('close', () => { if (A.view === 'charities') refreshRows(); });
    setInterval(tick, 1000);
  }

  async function init() {
    A.base = clone(embedded);
    A.panel = await detectPanel();
    bind();
    if (live()) {
      $('#signOutBtn').hidden = false;
      if (!(await loadLive())) return;
      setState('mute', 'Up to date');
    } else {
      try {
        const r = await fetch('hope.config.json', { cache: 'no-store' });
        if (r.ok) { const j = await r.json(); if (V.shapeOk(j)) A.base = j; }
      } catch (e) { /* opened from disk */ }
      setState('mute', 'Preview only, not live');
    }
    if (!V.shapeOk(A.base)) { $('#view').innerHTML = '<p class="err">No valid settings were found.</p>'; return; }
    A.draft = clone(A.base);
    const h = location.hash.slice(1);
    A.view = VIEWS.includes(h) ? h : 'charities';
    render();
  }
  init();
})();

</script>
</body>
</html>
